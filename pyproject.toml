[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx1-white-hacker"
version = "0.1.0"
description = "FX1 Digital Hubs ethical cybersecurity toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "dnspython>=2.6.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0"
]

[project.scripts]
fx1-recon = "fx1recon.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
