name: CI

on:
  pull_request:
    branches:
      - main
      - ai_main_fe2e0b6bec39494e8465

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local core bridge
        run: python -m unittest discover -s core-bridge -p 'test_*.py'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
